    <text x="400" y="145">Velocity proxy</text>
    <text x="135" y="255">Lobby</text>
    <text x="400" y="270">Dunga Dunga</text>
    <text x="655" y="255">Dungeon instance ×N</text>
    <text x="355" y="390">MongoDB</text>
    <text x="655" y="390">Job Scheduler</text>
    <text x="105" y="390">InfluxDB</text>
    <text x="105" y="475">Grafana</text>
  </g>
  <g fill="#8a94b0" font-size="12" text-anchor="middle">
