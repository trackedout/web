    <path d="M105 421V450"/>
  </g>
  <g stroke-width="2" fill="#1c2236">
    <rect x="330" y="5" width="140" height="50" rx="8" stroke="#8a94b0"/>
    <rect x="320" y="120" width="160" height="56" rx="8" stroke="#f0b35c"/>
    <rect x="40" y="230" width="190" height="56" rx="8" stroke="#6ea8fe"/>
    <rect x="305" y="245" width="190" height="56" rx="8" stroke="#b07cf0"/>
    <rect x="580" y="210" width="190" height="56" rx="8" stroke="#6ea8fe"/>
    <rect x="570" y="220" width="190" height="56" rx="8" stroke="#6ea8fe"/>
    <rect x="560" y="230" width="190" height="56" rx="8" stroke="#6ea8fe"/>
    <rect x="290" y="365" width="130" height="56" rx="8" stroke="#4fd1a1"/>
    <rect x="560" y="365" width="190" height="56" rx="8" stroke="#f0b35c"/>
