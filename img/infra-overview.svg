<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Infrastructure graph: players connect through the Velocity proxy to the Citadel lobby or a dungeon instance running Agronet and Brilliance. Both call the Dunga Dunga API backed by MongoDB. The job scheduler polls Dunga Dunga and launches dungeons. MongoDB data is synced to InfluxDB and shown in Grafana. Everything runs on a Kubernetes cluster.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6a8a"/></marker>
  </defs>
  <rect width="800" height="520" fill="#131723"/>
  <rect x="15" y="85" width="770" height="420" rx="12" fill="none" stroke="#5c6a8a" stroke-dasharray="6 6"/>
  <text x="30" y="108" fill="#8a94b0" font-size="13">kubernetes cluster (davybones)</text>
  <g stroke="#5c6a8a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M400 55V120"/>
    <path d="M340 176C240 190 140 190 135 230"/>
    <path d="M460 176C580 190 715 170 715 205"/>
    <path d="M230 273H305"/>
